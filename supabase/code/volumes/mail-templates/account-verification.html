<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#08090a;font-family:Arial,sans-serif;color:#f7f2e8">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#08090a;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#151719;border:1px solid #303337;border-radius:20px;padding:32px">
          <tr><td style="font-size:11px;letter-spacing:2px;color:#9ca0a4;font-weight:700">CASA DE ISABEL</td></tr>
          <tr><td style="padding-top:12px;font-size:28px;line-height:34px;font-weight:800">Confirme sua identidade</td></tr>
          <tr><td style="padding-top:12px;color:#b9bdc1;font-size:15px;line-height:23px">Digite este código na tela de confirmação da sua conta. Ele é pessoal e expira em 10 minutos.</td></tr>
          <tr><td align="center" style="padding:28px 0 22px">
            <span style="display:inline-block;background:#f3eddf;color:#101214;border-radius:14px;padding:17px 24px;font-size:30px;letter-spacing:8px;font-weight:800">{{ .Token }}</span>
          </td></tr>
          <tr><td style="color:#8f9498;font-size:12px;line-height:19px">Se você não iniciou esta confirmação, ignore o e-mail e mantenha o código em sigilo.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
